<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>みんあそくん ― 大人のイベント企画ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF6EC; --paper:#FFFFFF; --ink:#2C2620; --ink-soft:#6B6258;
    --coral:#E8602C; --coral-d:#C84A1C; --teal:#1F6F5C; --teal-d:#155446;
    --gold:#F2B441; --gold-soft:#FCEBC4; --line:#E7DECB; --shadow:rgba(80,55,20,.12);
    --tag:#FDEEE4; --ok:#2E8B57; --r:18px;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:"Noto Sans JP",sans-serif; background:var(--cream); color:var(--ink); font-size:18px; line-height:1.7; -webkit-text-size-adjust:100%;}
  h1,h2,h3,.disp{font-family:"Zen Maru Gothic",sans-serif;}
  header{background:linear-gradient(120deg,var(--coral),var(--gold)); color:#fff; padding:18px 20px; box-shadow:0 4px 14px var(--shadow); position:sticky; top:0; z-index:50;}
  .head-row{display:flex; flex-wrap:wrap; align-items:center; gap:14px; max-width:1100px; margin:0 auto;}
  .logo{font-family:"Zen Maru Gothic"; font-weight:900; font-size:1.5rem; letter-spacing:.5px; display:flex; align-items:center; gap:8px;}
  .logo small{display:block; font-size:.78rem; font-weight:500; opacity:.9; font-family:"Noto Sans JP";}
  .me{margin-left:auto; display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.22); padding:6px 8px 6px 16px; border-radius:999px;}
  .me .who-name{font-weight:700;}
  .me button{border:none; background:#fff; color:var(--coral-d); border-radius:999px; padding:7px 12px; font-weight:700; cursor:pointer; font-family:"Noto Sans JP"; font-size:.9rem;}
  .me button.logout{background:rgba(255,255,255,.35); color:#fff;}
  .prov{font-size:.72rem; font-weight:700; padding:2px 10px; border-radius:999px; background:#fff; color:var(--teal-d); border:1.5px solid var(--teal); white-space:nowrap; display:inline-flex; align-items:center; gap:4px;}
  .prov.google{color:#1a73e8; border-color:#1a73e8;}
  .prov.guest{color:#8a8a8a; border-color:#cfcfcf;}
  nav{background:var(--paper); border-bottom:3px solid var(--line); position:sticky; top:71px; z-index:40;}
  .tabs{display:flex; max-width:1100px; margin:0 auto; overflow-x:auto;}
  .tab{flex:1 0 auto; min-width:130px; border:none; background:none; cursor:pointer; padding:16px 10px 13px; font-family:"Zen Maru Gothic"; font-weight:700; font-size:1.02rem; color:var(--ink-soft); border-bottom:4px solid transparent; transition:.15s; white-space:nowrap;}
  .tab .en{display:block; font-size:.72rem; font-weight:500; font-family:"Noto Sans JP"; opacity:.7;}
  .tab .step{display:inline-flex; width:26px; height:26px; border-radius:50%; background:var(--line); color:#fff; font-size:.9rem; align-items:center; justify-content:center; margin-right:6px;}
  .tab:hover{color:var(--ink); background:#fffaf2;}
  .tab.active{color:var(--coral-d); border-bottom-color:var(--coral);}
  .tab.active .step{background:var(--coral);}
  main{max-width:1100px; margin:0 auto; padding:26px 18px 80px;}
  .panel{display:none; animation:fade .35s ease;}
  .panel.active{display:block;}
  @keyframes fade{from{opacity:0; transform:translateY(8px);}to{opacity:1; transform:none;}}
  .lead{background:var(--gold-soft); border-left:6px solid var(--gold); padding:14px 18px; border-radius:10px; margin:0 0 22px; font-size:1.02rem;}
  .lead b{color:var(--coral-d);}
  .sec-title{font-size:1.5rem; margin:0 0 4px; color:var(--teal-d);}
  .sec-sub{color:var(--ink-soft); margin:0 0 20px; font-size:.95rem;}
  .btn{font-family:"Zen Maru Gothic"; font-weight:700; border:none; border-radius:999px; padding:13px 22px; font-size:1.05rem; cursor:pointer; transition:.15s; display:inline-flex; align-items:center; gap:8px;}
  .btn:active{transform:translateY(1px);}
  .btn-coral{background:var(--coral); color:#fff;} .btn-coral:hover{background:var(--coral-d);}
  .btn-teal{background:var(--teal); color:#fff;} .btn-teal:hover{background:var(--teal-d);}
  .btn-ghost{background:#fff; color:var(--teal-d); border:2px solid var(--teal);} .btn-ghost:hover{background:#eef7f4;}
  .btn-google{background:#fff; color:#3c4043; border:2px solid #dadce0;} .btn-google:hover{background:#f7f8f8;}
  .btn-sm{padding:9px 16px; font-size:.95rem;}
  .btn[disabled]{opacity:.45; cursor:not-allowed;}
  .interest-bar{display:flex; flex-wrap:wrap; gap:9px; margin:0 0 22px;}
  .ipill{border:2px solid var(--line); background:#fff; border-radius:999px; padding:8px 16px; font-size:.98rem; font-weight:700; cursor:pointer; transition:.15s; color:var(--ink-soft);}
  .ipill:hover{border-color:var(--coral);}
  .ipill.on{background:var(--coral); color:#fff; border-color:var(--coral);}
  .people{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px;}
  .pcard{background:var(--paper); border:2px solid var(--line); border-radius:var(--r); padding:18px; transition:.18s;}
  .pcard.match{border-color:var(--coral); box-shadow:0 6px 18px var(--shadow);}
  .pcard.dim{opacity:.38;}
  .avatar{width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:"Zen Maru Gothic"; font-weight:900; font-size:1.5rem; color:#fff; margin-bottom:10px;}
  .pname{font-family:"Zen Maru Gothic"; font-weight:700; font-size:1.2rem; margin:0; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .ptags{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
  .tagchip{background:var(--tag); color:var(--coral-d); border-radius:8px; padding:4px 10px; font-size:.85rem; font-weight:700;}
  .tagchip.hit{background:var(--coral); color:#fff;}
  .match-note{background:var(--teal); color:#fff; font-size:.8rem;
